; =============================================================================
; Process supervision
; =============================================================================
; Two decisions here are deliberate, and both come from defects in the earlier
; images (abspwgm/absolute-rust-server#12 and #13):
;
; 1. The program below IS the game. scripts/server execs the binary rather than
;    launching it in the background and looping, so supervisor's startsecs,
;    startretries, autorestart and stopsignal apply to the game process itself.
;    A wrapper that outlives its child turns every one of those settings into
;    decoration: supervisor never sees an exit, never backs off, never gives up,
;    and a server that can never start crash-loops forever while the container
;    reports healthy.
;
; 2. Output goes to the container's stdout, not to a file. A log the operator
;    cannot reach with `docker logs` is a log that does not exist during an
;    incident - and in CI it meant assertions counting matches in a stream that
;    structurally could not contain the server's output.
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/satisfactory/supervisor.sock
chmod=0770
chown=satisfactory:satisfactory

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/satisfactory/supervisor.sock

[program:game]
command=/opt/satisfactory/scripts/server
user=satisfactory
; Without this the child inherits supervisord's HOME (/root), which it cannot
; read, and Steam initialisation fails on every start.
environment=HOME="/home/satisfactory",USER="satisfactory"
autostart=true
autorestart=unexpected
exitcodes=0
; A large world takes a while to generate on first boot; do not call it "up"
; until it has stayed up.
startsecs=60
startretries=3
; The shutdown ladder must stay ordered or the save is cut short:
;   STOP_TIMEOUT (120s, manifest.env)
;     < stopwaitsecs (here)
;       < stop_grace_period (docker-compose*.yml)
stopsignal=INT
stopwaitsecs=150
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:cron]
command=/usr/sbin/cron -f
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
