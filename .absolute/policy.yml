# Local policy for absolute-server-template.
# A game repository generated from this template inherits this file and edits
# it: the tiers and contract stay, the exceptions below are replaced by that
# game's real answers.
project: absolute-satisfactory-server
standard_version: "1.0.0"

audience: >-
  someone who has never used Docker, a terminal or a router's settings page,
  and wants a Satisfactory server their friends can join tonight

contract:
  - The manifest.env field names and their accepted values
  - >-
    The shared library's function names: is_true, is_server_running,
    server_process_pattern, resolve_admin_credential, fetch_pinned,
    get_remote_build_id, get_installed_build_id, public_port_list
  - The path layout /opt/<GAME_ID>, /config, /var/log/<GAME_ID>, /var/run/<GAME_ID>
  - The TEST_ROOT seam, which every unit test depends on
  - tests/run_unit.sh as the fast tier's entry point

# Clause 4.5: this repository keeps its own issue forms.
issue_templates:
  set: local
  reason: >-
    the organisation's inherited form asks for a version and an environment;
    triage for an image starts from the digest that actually ran, the game build
    the server reported at startup, and whether the problem is the updater, the
    backup or the ports

tiers:
  fast:
    gates: push
    command: bash tests/run_unit.sh
    budget: under a second
  merge:
    gates: merge
    command: bash tests/run_e2e.sh
    budget: around 40 minutes on a cold world
  release:
    gates: release
    command: bash tests/run_e2e.sh
    budget: as long as the world takes to generate

ready_ladder:
  up: server_start - the process stays up and binds the game port
  reachable: >-
    server_query - both game ports are bound and the server's own HTTPS API
    answers a health check from outside the container, over the published port
  discoverable: >-
    discoverable - Satisfactory has no server browser: a player adds a server
    by address and their client then asks that address what it is. The rung is
    that question, QueryServerState, asked with the Client token a passwordless
    login grants and answered with a running game, a session name and a player
    limit, and the player count it advertises matches the one
    the image's own helper reads. There is no list to be listed in, so this is
    the whole of discoverable for this game.
  authenticated: >-
    authenticated - a fresh server has no admin and no world, so the suite does
    what the first client does: passwordless login at InitialAdmin (which only
    an unclaimed server grants), ClaimServer with an admin password,
    PasswordLogin with that password, and CreateNewGame with the resulting
    token. A wrong password must be refused. The token is the one the game's
    own client gets, which is why this is a real session rather than a
    stand-in; what it is not is a player joining the world, since no headless
    Satisfactory client exists, and the verdict says so.
  recoverable: >-
    backup, graceful_shutdown, restart_update - a save on request, a container
    that stops by itself rather than being killed (exit 137), a save on disk
    afterwards, and a restart that comes back running the same session

security:
  layers:
    L1:
      requirements:
        default_branch_protected:
          status: met
          verified_by: https://github.com/abspwgm/absolute-game-servers/blob/main/governance/rulesets/default-branch.json
          reason: Applied as a repository ruleset from the governance definitions in the hub repository.
        required_checks_declared:
          status: met
          verified_by: https://github.com/abspwgm/absolute-game-servers/blob/main/governance/required-checks.json
          reason: The required check list is declared with the rulesets in the hub repository.
        secret_scanning_enabled:
          status: met
          verified_by: https://github.com/abspwgm/absolute-server-template/settings/security_analysis
          reason: Secret scanning and push protection are repository settings.
        no_secrets_in_repository: .github/workflows/conformance.yml
        no_deployment_detail_in_public: SECURITY.md
        licence_declared: LICENSE
    L2:
      requirements:
        inputs_pinned_immutably: .github/workflows/lint.yml
        pins_verified_before_use: tests/unit/test_pinned_fetch.sh
        unpinned_input_refused: tests/unit/test_pinned_fetch.sh
        pins_move_by_pr:
          status: met
          verified_by: https://github.com/abspwgm/absolute-game-servers/blob/main/governance/rulesets/default-branch.json
          reason: The branch ruleset blocks direct pushes, so a pin moves only through a reviewed PR.
        vulnerable_dependencies_block_release:
          status: exception
          exception: no-image-scan-yet
      controls:
        - id: unpinned-fetch-refused
          description: >-
            fetch_pinned refuses to run without both a URL and a sha256, and
            deletes a mismatching download before anything can use it. Every
            game image inherits this, so no game can quietly fetch "latest".
          verified_by: tests/unit/test_pinned_fetch.sh
        - id: pins-are-kept-current
          description: >-
            Pinning is half the control; the other half is that a pin moves.
            Every action SHA and the base image digest are carried forward by a
            weekly grouped Dependabot pull request rather than by someone
            remembering. The test fails when a kind of dependency appears in
            the tree that no ecosystem covers, so this repository cannot
            quietly fall out of cover.
          verified_by: tests/unit/test_dependabot.sh
    L3:
      requirements:
        base_image_from_approved_library: Dockerfile
        least_privilege_tokens: .github/workflows/lint.yml
        no_secrets_in_build_args: .github/workflows/lint.yml
        ephemeral_runners: .github/workflows/lint.yml
        fork_pr_cannot_publish: .github/workflows/publish.yml
    L4:
      requirements:
        provenance_and_sbom_attached: .github/workflows/publish.yml
        only_distributable_content: Dockerfile
        published_only_after_merge_tier: .github/workflows/publish.yml
    L5:
      requirements:
        least_privilege_runtime: config/supervisord.conf
        admin_interfaces_private: docker-compose.yml
        default_credentials_refused: tests/unit/test_credentials.sh
        fail_closed_on_state_destroying_paths: tests/unit/test_manifest.sh
        honest_health_reporting: scripts/healthcheck
      controls:
        - id: manifest-fails-closed
          description: >-
            A missing, placeholder or malformed manifest stops the container
            rather than being guessed. KILL is refused as a stop signal, because
            the wrong signal corrupts saves quietly.
          verified_by: tests/unit/test_manifest.sh
        - id: credential-guard-inherited
          description: >-
            Where the manifest names an admin password variable, an empty or
            denylisted value is replaced by a generated 32-character one, stored
            0600 and never logged. Every game with a console inherits it rather
            than reimplementing it.
          verified_by: tests/unit/test_credentials.sh
        - id: process-match-cannot-self-kill
          description: >-
            Process matching brackets the second character, so a shell whose own
            command line contains the pattern does not match it. Without this, a
            stop script kills the shell that issued it.
          verified_by: tests/unit/test_process_pattern.sh
    L6:
      requirements:
        snapshot_before_risk:
          status: exception
          exception: no-disaster-response-yet
        hold_on_failed_verification:
          status: exception
          exception: no-disaster-response-yet
        restore_rehearsed_in_ci:
          status: exception
          exception: no-disaster-response-yet
        retention_exercised_by_test: tests/e2e/test_backup.sh
    L7:
      requirements:
        scheduled_canary:
          status: exception
          exception: no-build-watch-yet
        one_issue_per_failure_class:
          status: exception
          exception: no-build-watch-yet
        security_policy_published: SECURITY.md
        findings_kept_private: SECURITY.md

exceptions:
  - id: no-disaster-response-yet
    reason: >-
      There is no snapshot, hold or rollback here yet. This game was chosen
      first precisely because it needs them - ficsit.app mods break on game
      updates - so the generic recovery CLI lands in the shared library rather
      than being written for Satisfactory alone and copied afterwards.
    expires: "2027-03-31"
  - id: no-build-watch-yet
    reason: >-
      Nothing boots this image against today's Steam build on a schedule, so
      "it still works" has no date on it. build-watch is a shared reusable
      workflow in the hub's plan rather than a per-game copy.
    expires: "2027-03-31"
  - id: no-image-scan-yet
    reason: >-
      The image is published (publish.yml), but nothing scans it for known
      vulnerabilities before release. Game files are downloaded at run time and
      are not in the image, so the scan covers the Debian base and our scripts.
    expires: "2027-03-31"
