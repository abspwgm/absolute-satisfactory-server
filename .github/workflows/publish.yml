# =============================================================================
# Publish: GHCR for testing, Docker Hub for the public
# =============================================================================
# Two registries, two audiences (absolute-game-servers docs/PLAN.md, "Registries"):
#
#   ghcr.io/abspwgm/<repo>    PRIVATE. Every build that passed E2E on main, for
#                             us to test. Never linked from a README or a guide.
#   docker.io/abspowergaming/<repo>  PUBLIC. What strangers pull. Only from a public
#                             repository, because a public repository is the
#                             claim that the image works (publication gate).
#
# Docker Hub receives the GHCR image by digest rather than a second build, so
# the bytes the public pulls are exactly the bytes we published for testing.
# =============================================================================

name: Publish Docker Image

on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/abspowergaming/${{ github.event.repository.name }}

jobs:
  # ---------------------------------------------------------------------------
  # Has this commit passed, ever?
  # ---------------------------------------------------------------------------
  # The gate used to be "did the run that woke me succeed". One self-hosted
  # runner pool serves every repository and E2E is serialised per repository,
  # so a queued run on main is cancelled whenever a newer run arrives. A
  # cancelled run is not a failure and not a pass - but the old gate read it as
  # "do not publish", silently, and the image for a commit that had genuinely
  # passed never reached anyone. Four images were missing from Docker Hub for
  # most of a day that way, and the hub's drift check was the only thing that
  # noticed (absolute-game-servers, governance-drift).
  #
  # So this asks the question that matters: is there a successful E2E run for
  # this exact commit? A commit that has never passed still cannot publish -
  # the gate is not weakened, it is just asked properly.
  gate:
    name: Has this commit passed E2E?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Look for a successful run of this commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          # workflow_run's `branches: [main]` matches by branch name, and a fork
          # pull request from the fork's own `main` has head branch "main" too.
          # Only a push to this repository may publish; otherwise a fork could
          # have its code built and pushed with our tokens.
          if [ "${EVENT}" = "workflow_run" ]; then
            if [ "${RUN_EVENT}" != "push" ] || [ "${RUN_REPO}" != "${GITHUB_REPOSITORY}" ]; then
              echo "Not a push to this repository (${RUN_EVENT} from ${RUN_REPO}); not publishing."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # A tag or a manual dispatch is a deliberate act by someone who can
            # already push here, and carries its own intent.
            echo "Triggered by ${EVENT}; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          passed="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&status=success" \
            --jq '[.workflow_runs[] | select(.name == "E2E Tests")] | length')"
          if [ "${passed}" -gt 0 ]; then
            echo "E2E has passed for ${SHA}; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No successful E2E run for ${SHA}; not publishing. A cancelled or failed run is not a pass."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  ghcr:
    name: Publish to GHCR (private, testing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run checks out the default branch head; pin to the commit
          # the gate found a passing run for, so a later push is never
          # published untested.
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dockerhub:
    name: Promote to Docker Hub (public)
    needs: ghcr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The publication gate: a private repository's image stays on GHCR.
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      packages: read
    steps:
      # Fail loudly rather than skip: a public repository whose image silently
      # never reaches Docker Hub is exactly the defect this workflow replaced.
      - name: Docker Hub credentials are configured
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${USERNAME}" ] || [ -z "${TOKEN}" ]; then
            echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not available to this repository. Set them as organization secrets."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Same tags as GHCR, same digest. imagetools copies the index, so the
      # provenance and SBOM attestations travel with it.
      - name: Copy the GHCR image to Docker Hub by digest
        env:
          DIGEST: ${{ needs.ghcr.outputs.digest }}
          TAGS: ${{ needs.ghcr.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            args+=(--tag "${DOCKERHUB_IMAGE}:${tag##*:}")
          done <<< "${TAGS}"
          docker buildx imagetools create "${args[@]}" "${GHCR_IMAGE}@${DIGEST}"
          {
            echo "## Published to Docker Hub"
            echo ""
            echo "**Digest:** \`${DIGEST}\`"
            echo ""
            echo '```'
            printf '%s\n' "${args[@]}" | grep -v -- '--tag'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
