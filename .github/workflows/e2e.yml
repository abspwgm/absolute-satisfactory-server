# =============================================================================
# End-to-end suite
# =============================================================================
# Written with the things the Valheim and Rust images learned the hard way
# already in place, rather than discovered here:
#
#   - fork pull requests never run on our own hardware
#   - the suite is serialised, because the runner pool shares one Docker daemon
#     and this suite uses fixed container names
#   - server files are seeded from the runner's local depot cache
#   - workspace ownership is reclaimed, because a container writing as root
#     leaves a landmine for the next checkout on a runner that is not discarded
# =============================================================================

name: E2E Tests

on:
  push:
    branches: [main]
  # Any base, not just main: a pull request stacked on another branch is still
  # a change that has to be gated.
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Skip the server file cache'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.repository }}
  cancel-in-progress: false

env:
  STEAM_APP_ID: '1690800'

jobs:
  lint:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck every bash script, by shebang
        run: |
          shellcheck --version
          mapfile -t files < <(grep -rl '^#!/bin/bash' scripts tests 2>/dev/null)
          printf '  %s\n' "${files[@]}"
          shellcheck -S error -s bash -x "${files[@]}"

      - name: Unit suites (no Docker)
        run: bash tests/run_unit.sh

      - name: Manifest is valid
        run: MANIFEST_FILE=manifest.env bash -c 'source scripts/manifest && manifest_load'

  e2e:
    name: End-to-End Tests
    # Fork pull requests go to a GitHub-hosted runner, free for public
    # repositories. Everything else takes the org pool, which holds the Steam
    # depot cache.
    runs-on: ${{ fromJSON(
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
      && '["ubuntu-latest"]'
      || '["self-hosted","linux","x64","absolute-e2e"]') }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The game learns the lab's public address from Steam and prints it: a
      # Source server's `status` carries it, and every console command's output
      # reaches the container log. On a public repository this log is public.
      # So on lab hardware the address is learned first and masked, which makes
      # GitHub redact every later occurrence in this log; after the suite it is
      # scrubbed from what is uploaded, and the job fails if the suite printed
      # it. Learned at run time, never stored: a residential address changes.
      # A hosted runner's address is GitHub's, and nothing is hidden. Fails
      # closed: a suite whose log cannot be redacted does not run here.
      - name: Mask the runner's public address
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          addresses=""
          for family in 4 6; do
            address=""
            for probe in https://checkip.amazonaws.com https://api64.ipify.org; do
              address="$(curl -${family} -fsS --max-time 10 "${probe}" 2>/dev/null | tr -d '[:space:]')" && [ -n "${address}" ] && break
              address=""
            done
            case "${family}:${address}" in
              4:*.*.*.*) ;;
              6:*:*) ;;
              *) address="" ;;
            esac
            if [ -n "${address}" ]; then
              echo "::add-mask::${address}"
              addresses="${addresses:+${addresses} }${address}"
            fi
          done
          case "${addresses}" in
            *.*.*.*) ;;
            *) echo "::error::Could not learn this runner's public IPv4 address, so this log cannot be redacted. Refusing to run the suite on lab hardware."; exit 1 ;;
          esac
          echo "RUNNER_PUBLIC_ADDRESS=${addresses}" >> "$GITHUB_ENV"
          echo "The runner's public address is masked for the rest of this job"

      - name: Create data directories
        run: mkdir -p data/server data/config

      # On the pool the depot is already on local disk, refreshed by a
      # root-owned timer no pull request can influence. A copy, never a
      # hardlink: a hardlink would let a job write through into the cache.
      - name: Seed server files from the local depot cache
        id: local-cache
        if: ${{ runner.environment == 'self-hosted' && github.event.inputs.skip_cache != 'true' }}
        run: |
          src="/srv/steam-cache/${{ env.STEAM_APP_ID }}"
          if [ -d "${src}" ] && [ -n "$(ls -A "${src}" 2>/dev/null)" ]; then
            cp -a "${src}/." data/server/
            echo "seeded=true" >> "$GITHUB_OUTPUT"
            echo "✅ seeded from ${src} ($(du -sh data/server | cut -f1))"
          else
            echo "seeded=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ no local depot cache at ${src}; SteamCMD will download"
          fi

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: absolute-satisfactory-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Through tee, so the scrub below can read what the suite printed. The
      # exit code stays the suite's: pipefail.
      - name: Run the suite
        run: |
          set -o pipefail
          mkdir -p test-artifacts
          bash tests/run_e2e.sh 2>&1 | tee test-artifacts/suite.log

      - name: Collect logs
        if: always()
        run: |
          mkdir -p test-artifacts
          docker logs satisfactory-server > test-artifacts/container.log 2>&1 || true
          cp -r data/logs test-artifacts/ 2>/dev/null || true

      # Masking covers this log; it does not cover what is uploaded, and an
      # artifact of a public repository is downloadable by anyone signed in. So
      # the address is scrubbed from everything under test-artifacts, and the
      # job fails if the suite itself printed it: the mask is the net, not the
      # floor. A test quotes what it asserts, and dumps a container's log
      # through dump_container_logs, which scrubs. The server's own log will
      # carry the address - Source servers print it - which is why that file is
      # scrubbed rather than judged.
      - name: Scrub the runner's address from the artifacts, and fail if the suite printed it
        if: ${{ always() && env.RUNNER_PUBLIC_ADDRESS != '' }}
        run: |
          printed=0
          for address in ${RUNNER_PUBLIC_ADDRESS}; do
            if grep -qF -- "${address}" test-artifacts/suite.log 2>/dev/null; then
              printed=1
            fi
            escaped="$(printf '%s' "${address}" | sed 's/[][\.*^$/]/\\&/g')"
            find test-artifacts -type f -exec sed -i "s/${escaped}/<runner-public-address>/g" {} +
          done
          remaining=0
          for address in ${RUNNER_PUBLIC_ADDRESS}; do
            grep -rqF -- "${address}" test-artifacts 2>/dev/null && remaining=1
          done
          if [ "${remaining}" = "1" ]; then
            echo "::error::The scrub left the runner's address in test-artifacts; nothing is uploaded from this run"
            rm -rf test-artifacts
            exit 1
          fi
          if [ "${printed}" = "1" ]; then
            echo "::error::The suite printed the runner's public address. This log is masked and the artifact is scrubbed, but a test that prints raw server output is the defect: quote what you assert, and dump a container's log through dump_container_logs."
            exit 1
          fi
          echo "test-artifacts carry no address of ours"

      # The ready-ladder verdict (standard 2.10), on its own so the fleet board's
      # collector can read it without unpacking logs. Transport, not the record:
      # the hub keeps the last conclusive verdict itself (2.11).
      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdict
          path: data/logs/verdict.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: test-artifacts/
          retention-days: 7

      # The container writes into data/ as root. On a hosted runner the machine
      # is discarded; on a self-hosted one the workspace outlives the job and
      # the next checkout dies with EACCES before anything starts.
      - name: Reclaim ownership of the workspace
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" data || true

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v 2>/dev/null || true

  build-only:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: absolute-satisfactory-server:build-test

      # The Rust image shipped for months with steamclient.so unreadable by the
      # server user, which no build check would have caught. These two would.
      - name: steamclient.so is readable by the server user
        run: |
          docker run --rm --user satisfactory absolute-satisfactory-server:build-test \
            test -r /home/satisfactory/.steam/sdk64/steamclient.so
          docker run --rm --user satisfactory absolute-satisfactory-server:build-test \
            test -r /home/satisfactory/.steam/sdk32/steamclient.so

      - name: supervisor gives the server the right HOME and user
        run: |
          docker run --rm absolute-satisfactory-server:build-test \
            grep -q 'HOME="/home/satisfactory"' /etc/supervisor/conf.d/game.conf
          docker run --rm absolute-satisfactory-server:build-test \
            grep -qx 'user=satisfactory' /etc/supervisor/conf.d/game.conf

      - name: the manifest is present and valid inside the image
        run: |
          docker run --rm absolute-satisfactory-server:build-test \
            bash -c 'source /opt/satisfactory/scripts/manifest && MANIFEST_FILE=/opt/manifest.env manifest_load'
